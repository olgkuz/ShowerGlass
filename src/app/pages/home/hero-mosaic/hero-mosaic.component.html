<section #section class="hero-mosaic" aria-label="Душевые ограждения из стекла">
  <div class="hero-mosaic__text">
    <h1>Изготовим и установим душевое ограждение по Вашим размерам</h1>
    <p>
      Уже 15 лет занимаемся проектированием и установкой душевых, ограждений, дверей,
      перегородок из стекла на заказ по индивидуальным проектам. Установили более 2000 изделий из стекла.
    </p>
  </div>

  <div #stage class="hero-mosaic__stage">
    <img
      #mainPart
      class="hero-mosaic__part hero-mosaic__part--main"
      src="assets/hero/hero-main.webp"
      alt="Закаленное стекло толщиной 8-10 мм"
      loading="lazy"
    />
    <img
      #hingePart
      class="hero-mosaic__part hero-mosaic__part--hinge"
      src="assets/hero/hero-hinge.webp"
      alt="Премиальная фурнитура"
      loading="lazy"
    />
    <img
      #handlePart
      class="hero-mosaic__part hero-mosaic__part--handle"
      src="assets/hero/hero-handle.webp"
      alt="Монтаж под ключ"
      loading="lazy"
    />
    <img
      #footerPart
      class="hero-mosaic__part hero-mosaic__part--footer"
      src="assets/hero/hero-footer.webp"
      alt="Преимущества компании"
      loading="lazy"
    />
  </div>
</section>
