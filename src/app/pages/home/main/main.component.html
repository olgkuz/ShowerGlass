<section class="mobile-hero-carousel" aria-label="Основные изделия из стекла" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
  <div class="mobile-hero-carousel__slide" *ngFor="let slide of heroSlides; let i = index" [class.is-active]="i === activeSlide" [attr.aria-hidden]="i !== activeSlide">
    <img [src]="slide.image" [alt]="slide.title" [attr.loading]="i === 0 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 0 ? 'high' : 'low'" />
    <div class="mobile-hero-carousel__shade"></div>
    <div class="mobile-hero-carousel__content">
      <h1>{{ slide.title }}</h1>
      <p>{{ slide.text }}</p>
      <a pButton [routerLink]="slide.link" class="mobile-hero-carousel__button">{{ slide.button }}</a>
    </div>
  </div>
  <button type="button" class="mobile-hero-carousel__arrow mobile-hero-carousel__arrow--prev" (click)="previousSlide(); $event.stopPropagation()" aria-label="Предыдущий слайд">‹</button>
  <button type="button" class="mobile-hero-carousel__arrow mobile-hero-carousel__arrow--next" (click)="nextSlide(); $event.stopPropagation()" aria-label="Следующий слайд">›</button>
  <div class="mobile-hero-carousel__dots" role="tablist" aria-label="Слайды">
    <button *ngFor="let slide of heroSlides; let i = index" type="button" role="tab" [attr.aria-selected]="i === activeSlide" [class.is-active]="i === activeSlide" (click)="setSlide(i); $event.stopPropagation()" [attr.aria-label]="'Слайд ' + (i + 1)"></button>
  </div>
</section>

<section class="main-banner">
  <div class="main-grid">
    <div class="main-image">
      <picture>
        <source
          media="(min-width: 576px)"
          srcset="/assets/img/main-banner-desktop.webp"
          width="1672"
          height="941"
        />
        <img
          src="/assets/img/main-banner.webp"
          alt="Душевые ограждения"
          width="742"
          height="990"
          fetchpriority="high"
        />
      </picture>

      <!-- Добавлено для мобильной версии -->
      <div class="main-overlay-mobile">
        <h1 class="title-mobile">
          ДУШЕВЫЕ ОГРАЖДЕНИЯ<br />
          ИЗ СТЕКЛА НА ЗАКАЗ
        </h1>
        <button
          #mobileMeasureBtn
          pButton
          type="button"
          label="Вызвать мастера на замер"
          class="main-button"
          (click)="onMeasureClick(mobileMeasureBtn)"
        ></button>
      </div>
    </div>

    <!-- Desktop content -->
    <div class="main-content">
      <div class="main-title">
        <div class="title-top">ДУШЕВЫЕ ОГРАЖДЕНИЯ</div>
        <div class="title-bottom">ИЗ СТЕКЛА НА ЗАКАЗ</div>
      </div>

      <button
        #desktopMeasureBtn
        pButton
        type="button"
        label="Вызвать мастера на замер"
        class="main-button"
        (click)="onMeasureClick(desktopMeasureBtn)"
      ></button>
    </div>
  </div>
</section>
