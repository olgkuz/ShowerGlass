<p-toast></p-toast>

<section id="contactform" class="contact-form-section">
  <h2>Оставьте заявку</h2>
  <p>Оставьте контакты и кратко опишите задачу - ответим в рабочее время.</p>

  <form [formGroup]="contactForm" (ngSubmit)="submitForm()">
    <div class="form-group">
      <input
        type="text"
        pInputText
        placeholder="Ваше имя"
        formControlName="name"
      />
    </div>
    <div class="form-group">
      <input
        type="tel"
        pInputText
        placeholder="Телефон"
        formControlName="phone"
        inputmode="tel"
        [attr.pattern]="phonePattern"
      />
    </div>
    <div class="form-group">
      <textarea
        pInputTextarea
        rows="4"
        placeholder="Комментарий (необязательно)"
        formControlName="message"
      ></textarea>
    </div>

    <div class="form-group consent">
      <p-checkbox
        formControlName="consent"
        binary="true"
        inputId="contact-consent"
      ></p-checkbox>
      <label for="contact-consent">
        Я даю согласие на обработку персональных данных в соответствии с
        <a routerLink="/personal-data-consent" target="_blank">
          Согласием на обработку персональных данных
        </a>.
      </label>
    </div>

    <p class="policy-note">
      С
      <a routerLink="/privacy-policy" target="_blank">
        Политикой в отношении обработки персональных данных
      </a>
      можно ознакомиться по ссылке.
    </p>

    <button
      pButton
      type="submit"
      label="Отправить"
      [disabled]="contactForm.invalid"
    ></button>
  </form>
</section>
