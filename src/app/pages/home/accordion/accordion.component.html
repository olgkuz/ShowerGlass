<section class="order-flow">
  <div class="order-flow__intro">
    <span>Этапы работы</span>
    <h2>Как заказать душевое ограждение из стекла</h2>
    <p>
      От предварительного расчета до монтажа: каждый этап фиксируется и
      согласуется до запуска конструкции в производство.
    </p>
  </div>

  <div class="order-flow__steps">
    <article
      class="step"
      *ngFor="let item of stepsList; let i = index"
      [class.step--open]="isStepOpen(i)"
    >
      <button
        type="button"
        class="step__button"
        [attr.aria-expanded]="isStepOpen(i)"
        (click)="toggleStep(i)"
      >
        <span class="step__number">{{ formatStepNumber(i) }}</span>
        <span class="step__title">{{ getStepTitle(item.step) }}</span>
        <span class="step__icon" aria-hidden="true"></span>
      </button>

      <div class="step__content" *ngIf="isStepOpen(i)">
        <p>{{ item.text }}</p>
      </div>
    </article>
  </div>
</section>
