<h2>Панель настроек администратора</h2>
<p *ngIf="user">Добро пожаловать, {{ user.name }}</p>

<div class="logout-section">
  <p-button label="Выйти из админки" icon="pi pi-sign-out" (click)="logout()" styleClass="p-button-danger"></p-button>
</div>

<p-tabView>
  <p-tabPanel header="Загрузка статьи">
    <app-articleupload></app-articleupload>
  </p-tabPanel>

  <p-tabPanel header="Загрузка фото">
    <app-photoupload></app-photoupload>
  </p-tabPanel>
</p-tabView>
